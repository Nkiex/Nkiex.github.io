<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarkov Time</title>
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #d1d1d1; 
            font-family: 'Courier New', monospace; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }
        .card { 
            border: 1px solid #333; 
            padding: 40px; 
            text-align: center; 
            background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
            width: 280px;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: #e59323; } 
        .time { font-size: 3rem; font-weight: bold; color: #fff; }
        .label { color: #e59323; letter-spacing: 2px; margin-bottom: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="label">LOCAL TIME</div>
            <div id="clock-left" class="time">--:--:--</div>
        </div>
        <div class="card">
            <div class="label">LOCAL TIME</div>
            <div id="clock-right" class="time">--:--:--</div>
        </div>
    </div>

    <script>
        function updateTarkovClocks() {
            const acceleration = 7; 
            const msInDay = 24 * 60 * 60 * 1000;
            
            // Tiempo actual acelerado
            const now = Date.now() * acceleration;

            const formatTime = (offsetHours) => {
                const offsetMs = offsetHours * 60 * 60 * 1000;
                const timeWithOffset = (now + offsetMs) % msInDay;
                
                const totalSeconds = Math.floor(timeWithOffset / 1000);
                const h = Math.floor(totalSeconds / 3600) % 24;
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;

                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const left = document.getElementById('clock-left');
            const right = document.getElementById('clock-right');

            if (left && right) {
                left.innerText = formatTime(0);
                right.innerText = formatTime(12);
            }
        }

        // Ejecutar inmediatamente
        updateTarkovClocks();
        // Actualizar frecuentemente para suavidad
        setInterval(updateTarkovClocks, 100);
    </script>
</body>
</html>
</body>
</html>
