<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tarkov Time Raid Selection</title>
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #d1d1d1; 
            font-family: 'Courier New', monospace; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container { display: flex; justify-content: center; gap: 50px; }
        .card { 
            border: 1px solid #333; 
            padding: 40px; 
            text-align: center; 
            background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
            width: 300px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .card:hover { border-color: #e59323; } 
        .time { font-size: 3rem; font-weight: bold; color: #fff; }
        .label { color: #e59323; letter-spacing: 2px; margin-bottom: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="label">LOCAL TIME</div>
            <div id="clock-left" class="time">00:00:00</div>
        </div>
        <div class="card">
            <div class="label">LOCAL TIME</div>
            <div id="clock-right" class="time">00:00:00</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
